version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # バージョン更新を停止する（セキュリティ更新はこの上限の対象外）
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
  # @serendie/* のバージョン更新用。
  # target-branch を指定したエントリの設定はセキュリティ更新に使われないため、
  # allow で絞ってもセキュリティ更新が止まらない
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "@serendie/*"
    groups:
      serendie:
        patterns:
          - "@serendie/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
